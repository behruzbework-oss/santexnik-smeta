function tCol(t,st){return "#9b1c1c";}
function loopTemps(z,st,ti){const ts=num(st.tsF),tr=num(st.trF),L=plen(z.full),lam=L/Math.log(Math.max(1.01,(ts-ti)/Math.max(0.5,tr-ti)));return d=>ti+(ts-ti)*Math.exp(-d/lam);}
function svgRoom(x,st,opt={}){const P=x.P;if(!P)return "";const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const W=opt.w||340,pad=opt.pad??44,sc=Math.min((W-2*pad)/(mxx-mnx),((opt.h||260)-2*pad)/(mxy-mny)),Hh=(mxy-mny)*sc+2*pad;
  const T=p=>[pad+(p[0]-mnx)*sc,Hh-pad-(p[1]-mny)*sc];const pl=a=>a.map(p=>T(p).map(v=>v.toFixed(1)).join(",")).join(" ");let g="";
  if(opt.pipes!==false)x.loops.forEach(z=>{const f=loopTemps(z,st,x.ti),pts=z.core;let d=plen(z.trS),acc=[pts[0]];
    for(let i=1;i<pts.length;i++){acc.push(pts[i]);d+=len(sub(pts[i],pts[i-1]));if(acc.length>=8||i===pts.length-1){g+=`<polyline points="${pl(acc)}" fill="none" stroke="${tCol(f(d),st)}" stroke-width="${opt.sw||1.6}" stroke-linecap="round"/>`;acc=[pts[i]];}}});
  P.forEach((p,i)=>{const q=P[(i+1)%4],a=T(p),b=T(q),ext=x.r.ext[i],op=x.r.open&&x.r.open[i];g+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${op?"#b9bec5":ext?"#8a5a2b":"#3a4048"}" stroke-width="${op?2:ext?7:3}" stroke-dasharray="${op?"6 5":""}" stroke-linecap="round"/>`;
    if(opt.tap)g+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="transparent" stroke-width="34" onclick="App.toggleExt(${i})" style="cursor:pointer"/>`;});
  (x.r.doors||[]).forEach(o=>{const w=o.w|0,a0=P[w],b0=P[(w+1)%4],d=nrm(sub(b0,a0)),Lw=len(sub(b0,a0)),t=Math.max(0,Math.min(Lw,+o.t||0)),c=add(a0,mul(d,t));
    if(o.kind==="hole"){const m=T(c);g+=`<circle cx="${m[0].toFixed(1)}" cy="${m[1].toFixed(1)}" r="6" fill="#fff" stroke="#e07a00" stroke-width="3"/>`;}
    else{const p1=T(add(c,mul(d,-(+o.wd||0.9)/2))),p2=T(add(c,mul(d,(+o.wd||0.9)/2)));g+=`<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#fff" stroke-width="10"/><line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="4 3"/>`;}});
  if(opt.labels!==false){const lab=["a","b","c","d"];P.forEach((p,i)=>{const q=P[(i+1)%4],m=T(lerp(p,q,.5)),dv=sub(q,p),l=len(dv),nn=[dv[1]/l,-dv[0]/l],cx=m[0]+nn[0]*22,cy=m[1]-nn[1]*22;
    g+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="13" fill="#1565d8"/><text x="${cx.toFixed(1)}" y="${(cy+5).toFixed(1)}" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${lab[i]}</text>`;
    if(opt.dims&&num(x.sides[i])){const tx=m[0]-nn[0]*30,ty=m[1]+nn[1]*30+5;g+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" font-size="15" font-weight="700" fill="#111418" stroke="#fff" stroke-width="5" paint-order="stroke" text-anchor="middle">${fmt(x.sides[i],2)} m</text>`;}});}
  return `<svg viewBox="0 0 ${W} ${Hh.toFixed(0)}" width="100%" style="display:block">${g}</svg>`;}

  h+=T("w2 dark","App.sec(6,'smeta')","Smeta · "+VARS[P.variant][0],`${fmt(cur3.total/1e6,1)}<small>mln so'm</small>`,P.budget?(cur3.total<=P.budget?`Byudjetga sig'adi · ${fmt((P.budget-cur3.total)/1e6,1)} mln qoladi`:`Byudjetdan ${fmt((cur3.total-P.budget)/1e6,1)} mln oshadi`):"Material va uskunalar, usta haqisiz","↗",
    `<div class="chips">${Object.entries(VARS).map(([k,v])=>`<button class="chip ${P.variant===k?"on":""}" onclick="event.stopPropagation();App.variant('${k}')">${v[0]} ${fmt(S[k].total/1e6,0)}</button>`).join("")}</div>`);
  h+=T("hot","App.sec(6,'tizim')","Kotyol",`${bs.n>1?bs.n+"×"+bs.unitKW:H.kw}<small>kVt</small>`,`Umumiy yuk ${fmt(H.totKW,1)} kVt`);

function svgColl(C){const x=C.room,P=x.P,xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),W=340,pad=40,sc=Math.min((W-2*pad)/(mxx-mnx),(320-2*pad)/(mxy-mny)),Hh=(mxy-mny)*sc+2*pad;
  window.SVGT=window.SVGT||{};const key=C.f+'_'+C.ci;SVGT[key]={mnx,mny,sc,Hh,pad,W,P};
  const T=p=>[pad+(p[0]-mnx)*sc,Hh-pad-(p[1]-mny)*sc];let g="";
  P.forEach((p,i)=>{const q=P[(i+1)%4],a=T(p),b=T(q),on=i===C.wall,ext=x.r.ext[i];g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${on?"#1565d8":ext?"#8a5a2b":"#9aa3ad"}" stroke-width="${on?10:ext?7:5}" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="40" style="cursor:pointer" onclick="App.collAt(${C.f},${C.ci},${i},event)"/>`;});
  const m=T(sub(C.wallPt,x.pos)),hw=Math.max(14,C.n*0.88*sc/2);
  const vert=Math.abs(C.dir[1])>Math.abs(C.dir[0]),rw=vert?24:2*hw,rh=vert?2*hw:24;g+=`<rect x="${m[0]-rw/2}" y="${m[1]-rh/2}" width="${rw}" height="${rh}" rx="6" fill="#1565d8"/><text x="${m[0]}" y="${m[1]+5}" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">KOLL</text>`;
  return `<svg id="svgc${C.f}_${C.ci}" viewBox="0 0 ${W} ${Hh.toFixed(0)}" width="100%">${g}</svg>
  <div class="row" style="margin-top:6px;align-items:center;gap:8px"><span style="font-size:13px;white-space:nowrap">Devor bo'ylab:</span><input type="range" min="0" max="${C.Lw.toFixed(2)}" step="0.05" value="${C.t.toFixed(2)}" style="flex:1" oninput="this.nextElementSibling.textContent=(+this.value).toFixed(2)+' m'" onchange="App.coll(${C.f},${C.ci},'t',+this.value)"><b style="font-size:13px">${C.t.toFixed(2)} m</b></div>
  <div style="font-size:12px;color:#667">Devorni bosing — kollektor shu nuqtaga qo'yiladi. Shkaf 80×80 sm, devorga 10 sm kiradi. Quvurlar avtomatik qayta yo'naltiriladi.</div>`;}
