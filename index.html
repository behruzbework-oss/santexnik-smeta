const U={wall:{gisht38:1.45,gisht51:1.15,blok30:0.45,gishtIzol:0.5,xom:1.3},win:{pl2:2.7,pl3:1.6,yog:3.0},roof:{izol:0.35,noizol:1.1},floor:{izol:0.35,noizol:0.9}};

const SET_DEF={tOut:-15,people:4,tpre:"orta",tsF:45,trF:35,rpre:"r70",tsR:70,trR:55,wall:"gisht38",win:"pl2",roof:"izol",floor:"izol",pipe:"16",maxLoop:90,edge:10,screed:7,q70:180,screedRes:7,bendR:8};

/* ================= SAQLASH ================= */
const uid=()=>Math.random().toString(36).slice(2,9);
function mkRoom(type,s,o={}){return Object.assign({id:uid(),name:RT[type].n,type,a:s[0],b:s[1],c:s[2],d:s[3],diag:0,diag2:0,h:2.8,ext:[false,false,false,false],win:0,heat:"pol",cover:"laminat",step:RT[type].step,att:"",side:"r",top:true,ground:true},o);}
function demoProject(){const r1=mkRoom("yashash",[5,4.02,5,4.2],{ext:[true,true,false,false],win:3,heat:"ikkalasi"}),r2=mkRoom("yotoq",[4,3.5,4,3.5],{ext:[true,true,false,false],win:1.8,att:r1.id,side:"r"}),r3=mkRoom("hammom",[2.5,2,2.5,2],{ext:[false,true,true,false],win:0.5,heat:"ikkalasi",cover:"kafel",att:r2.id,side:"t"});
  return {id:uid(),name:"Namuna uy",client:"",phone:"",created:Date.now(),set:Object.assign({},SET_DEF),rooms:[r1,r2,r3],coll:{room:r1.id,wall:1},variant:"orta",budget:0};}
function newProject(){return {id:uid(),name:"",client:"",phone:"",created:Date.now(),set:Object.assign({},SET_DEF),rooms:[],coll:{room:"",wall:0},variant:"orta",budget:0};}
let DB=(()=>{try{const j=JSON.parse(localStorage.getItem("usta_v3"));if(j&&j.projects)return j;}catch(e){}return {projects:[demoProject()],price:{}};})();
DB.price=Object.assign(Object.fromEntries(Object.entries(PRICE_DEF).map(([k,v])=>[k,v[0]])),DB.price||{});
DB.projects.forEach(p=>p.set=Object.assign({},SET_DEF,p.set));

const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0;};
const fmt=(n,d=0)=>(+n||0).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= GEOMETRIYA ================= */
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]],add=(p,q)=>[p[0]+q[0],p[1]+q[1]],mul=(p,k)=>[p[0]*k,p[1]*k],len=p=>Math.hypot(p[0],p[1]),cross=(p,q)=>p[0]*q[1]-p[1]*q[0],dot=(p,q)=>p[0]*q[0]+p[1]*q[1],lerp=(p,q,t)=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],nrm=p=>{const l=len(p)||1;return [p[0]/l,p[1]/l];};
function circ(p0,r0,p1,r1){const d=len(sub(p1,p0));if(d>r0+r1+1e-9||d<Math.abs(r0-r1)-1e-9||d===0)return null;const a=(r0*r0-r1*r1+d*d)/(2*d),h=Math.sqrt(Math.max(0,r0*r0-a*a));const m=add(p0,mul(sub(p1,p0),a/d));const ox=-(p1[1]-p0[1])*h/d,oy=(p1[0]-p0[0])*h/d;return [[m[0]+ox,m[1]+oy],[m[0]-ox,m[1]-oy]];}
function area(P){let s=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];s+=p[0]*q[1]-q[0]*p[1];}return s/2;}
function perim(P){let s=0;for(let i=0;i<P.length;i++)s+=len(sub(P[(i+1)%P.length],P[i]));return s;}
function plen(L){let s=0;for(let i=1;i<L.length;i++)s+=len(sub(L[i],L[i-1]));return s;}
function lineX(p1,d1,p2,d2){const den=cross(d1,d2);if(Math.abs(den)<1e-12)return null;const t=cross(sub(p2,p1),d2)/den;return add(p1,mul(d1,t));}
function shape(r){const a=num(r.a),b=num(r.b),c=num(r.c),d=num(r.d),dg=num(r.diag);
  if(a<=0||b<=0||c<=0||d<=0)return {err:"To'rtta devorning hammasini o'lchab kiriting"};
  const A=[0,0],B=[a,0];let C,D;
  if(dg>0){const x=circ(A,dg,B,b);if(!x)return {err:"Diagonal devorlarga mos kelmadi. Diagonal yoki b devorni qayta o'lchang"};C=x[0][1]>=x[1][1]?x[0]:x[1];const y=circ(A,d,C,c);if(!y)return {err:"Diagonal devorlarga mos kelmadi. Diagonal yoki c, d devorlarni qayta o'lchang"};D=cross(C,y[0])>cross(C,y[1])?y[0]:y[1];}
  else{D=[0,d];const x=circ(B,b,D,c);if(!x)return {err:"Devor o'lchamlari bir-biriga to'g'ri kelmadi. Qayta o'lchang"};C=(x[0][0]+x[0][1])>(x[1][0]+x[1][1])?x[0]:x[1];}
  const P=[A,B,C,D];if(area(P)<=0)return {err:"Xona shakli chiqmadi, o'lchamlarni tekshiring"};const o={P};
  if(num(r.diag2)>0){const dif=Math.abs(len(sub(D,B))-num(r.diag2));if(dif>0.03)o.warn=`Ikkinchi diagonal hisobdan ${fmt(dif*100)} sm farq qilyapti — bitta o'lcham xato bo'lishi mumkin`;}
  return o;}
function inset(P,dist){const n=P.length,L=[];for(let i=0;i<n;i++){const p=P[i],q=P[(i+1)%n],dv=sub(q,p),l=len(dv);L.push([add(p,mul([-dv[1]/l,dv[0]/l],dist)),dv]);}
  const Q=[];for(let i=0;i<n;i++){const a=L[(i+n-1)%n],b=L[i];const x=lineX(a[0],a[1],b[0],b[1]);if(!x)return null;Q.push(x);}
  if(area(Q)<=1e-4)return null;for(let i=0;i<n;i++){const d0=sub(P[(i+1)%n],P[i]),d1=sub(Q[(i+1)%n],Q[i]);if(dot(d0,d1)<=0||len(d1)<0.18)return null;}return Q;}
/* ikki qatorli spiral: borish juft halqalar bo'ylab markazga, qaytish toq halqalar bo'ylab — kesishmaydi */
function spiral(Z,e0,s){const R=[];for(let k=0;k<200;k++){const q=inset(Z,e0+k*s);if(!q)break;R.push(q);}if(R.length<2)return null;
  const edge=(Q,i)=>[Q[i],sub(Q[(i+1)%4],Q[i])];
  const path=st=>{const pts=[R[st][0]];for(let k=st;k<R.length;k+=2){if(k>st){const e3=edge(R[k-2],3),e0b=edge(R[k],0);pts.push(lineX(e3[0],e3[1],e0b[0],e0b[1])||R[k][0]);}pts.push(R[k][1],R[k][2],R[k][3]);}return pts;};
  return {sup:path(0),ret:path(1)};}
/* burchaklarni R radiusli yoy bilan bukish (quvur sinmasligi uchun) */
function roundPath(P,R){if(P.length<3)return {pts:P.slice(),minR:Infinity};const out=[P[0]];let minR=Infinity;
  for(let i=1;i<P.length-1;i++){const A=P[i-1],V=P[i],B=P[i+1],da=len(sub(A,V)),db=len(sub(B,V));if(da<1e-6||db<1e-6)continue;
    const u1=mul(sub(A,V),1/da),u2=mul(sub(B,V),1/db),th=Math.acos(Math.max(-1,Math.min(1,dot(u1,u2))));if(th>Math.PI-0.02){out.push(V);continue;}
    const tn=Math.tan(th/2),tmax=Math.min(da,db)*0.5,r=Math.min(R,tmax*tn),t=r/tn;minR=Math.min(minR,r);
    const T1=add(V,mul(u1,t)),T2=add(V,mul(u2,t)),C=add(V,mul(nrm(add(u1,u2)),r/Math.sin(th/2)));
    let a1=Math.atan2(T1[1]-C[1],T1[0]-C[0]),a2=Math.atan2(T2[1]-C[1],T2[0]-C[0]),dl=a2-a1;while(dl>Math.PI)dl-=2*Math.PI;while(dl<-Math.PI)dl+=2*Math.PI;
    const n=Math.max(3,Math.ceil(Math.abs(dl)/(Math.PI/14)));for(let k=0;k<=n;k++){const a=a1+dl*k/n;out.push([C[0]+r*Math.cos(a),C[1]+r*Math.sin(a)]);}}
  out.push(P[P.length-1]);return {pts:out,minR};}
function bez(P0,P1,P2,P3,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*u*P0[0]+3*u*u*t*P1[0]+3*u*t*t*P2[0]+t*t*t*P3[0],u*u*u*P0[1]+3*u*u*t*P1[1]+3*u*t*t*P2[1]+t*t*t*P3[1]]);}return o;}
function minCurv(pts){let m=Infinity;for(let i=1;i<pts.length-1;i++){const a=len(sub(pts[i],pts[i-1])),b=len(sub(pts[i+1],pts[i])),c=len(sub(pts[i+1],pts[i-1])),k=Math.abs(cross(sub(pts[i],pts[i-1]),sub(pts[i+1],pts[i-1])));if(k<1e-12)continue;m=Math.min(m,a*b*c/(2*k));}return m;}
/* markazdagi 180° burilish: radius ≥ 80 mm bo'lguncha "shishiriladi" */
function arcPts(O,P,Q,long){const r=len(sub(P,O)),a1=Math.atan2(P[1]-O[1],P[0]-O[0]),a2=Math.atan2(Q[1]-O[1],Q[0]-O[0]);let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;if(long)d=d>0?d-2*Math.PI:d+2*Math.PI;
  const n=Math.max(4,Math.ceil(Math.abs(d)/(Math.PI/18))),o=[];for(let k=0;k<=n;k++){const a=a1+d*k/n;o.push([O[0]+r*Math.cos(a),O[1]+r*Math.sin(a)]);}return o;}
/* "kolba" burilish: ikki kichik yoy (r) + katta yoy (R), hammasi ≥ 80 mm */
function centerTurn(sup,ret){let S=sup[sup.length-1],E=ret[ret.length-1];const f=nrm(sub(S,sup[sup.length-2])),pre=[],post=[];const pj=dot(sub(S,E),f);
  if(pj>=0){const Ex=add(E,mul(f,pj));post.push(E);E=Ex;}else{const Sx=add(S,mul(f,-pj));pre.push(Sx);S=Sx;}

function svgColl(x){const P=x.P,xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),W=340,pad=40,sc=Math.min((W-2*pad)/(mxx-mnx),(220-2*pad)/(mxy-mny)),Hh=(mxy-mny)*sc+2*pad;
  const T=p=>[pad+(p[0]-mnx)*sc,Hh-pad-(p[1]-mny)*sc];let g="";const sel=H.coll&&H.coll.room===x.r.id?H.coll.wall:-1;
  P.forEach((p,i)=>{const q=P[(i+1)%4],a=T(p),b=T(q),m=T(lerp(p,q,.5)),on=i===sel;g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${on?"#1565d8":"#9aa3ad"}" stroke-width="${on?10:5}" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="transparent" stroke-width="40" onclick="App.coll('wall',${i})"/>`;
    if(on)g+=`<rect x="${m[0]-22}" y="${m[1]-12}" width="44" height="24" rx="6" fill="#1565d8"/><text x="${m[0]}" y="${m[1]+5}" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">KOLL</text>`;});
  return `<svg viewBox="0 0 ${W} ${Hh.toFixed(0)}" width="100%">${g}</svg>`;}

if(tg&&tg.BackButton)tg.BackButton.onClick(App.back);

/* ---------- ULASHISH ---------- */
App.text=()=>{const P=cur(),sm=smeta(H,P.variant);let t=`🔧 ${P.name||"Loyiha"} — smeta (${VARS[P.variant][0]})\nMaydon: ${fmt(H.A,1)} m² · Kotyol: ${H.kw} kVt\n`;
  H.ok.forEach(x=>{t+=`\n▫️ ${x.r.name} ${fmt(x.A,1)} m²`+(x.loops.length?`: ${x.loops.length} kontur (${x.loops.map(z=>fmt(z.L)).join("+")} m)`:"")+(x.sec?`, radiator ${x.sec} seks.`:"");});
  t+="\n";sm.L.forEach(x=>t+=`\n• ${x.name}: ${fmt(x.qty,x.qty%1?1:0)} ${x.unit} — ${fmt(x.sum)}`);return t+`\n\nJAMI: ${fmt(sm.total)} so'm`;};
App.toBot=()=>{const t=App.text();if(tg&&tg.sendData&&tg.initData&&!(tg.initDataUnsafe&&tg.initDataUnsafe.query_id)){tg.sendData(JSON.stringify({text:t.slice(0,3900)}));}
  else if(tg&&tg.showAlert)tg.showAlert('Botga yuborish uchun ilovani chat pastidagi "📐 Loyihani ochish" tugmasi orqali oching. Hozir "Mijozga ulashish" ni ishlating.');else App.share();};
App.share=()=>{const t=App.text();if(tg&&tg.openTelegramLink)tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent("https://t.me/Santexnik_Smeta_bot")+"&text="+encodeURIComponent(t));else if(navigator.share)navigator.share({text:t});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert("Smeta nusxalandi");}};

/* ---------- 3D ulanishi ---------- */
App.o3={flow:true,layers:false,heat:false};
App.t3=k=>{App.o3[k]=!App.o3[k];if(k==="heat"&&App.o3.heat)App.o3.layers=false;if(k==="layers"&&App.o3.layers)App.o3.heat=false;render();};
function show3d(){const slot=$("slot3d"),v=$("v3d");if(slot&&v&&v.parentNode!==slot)slot.appendChild(v);if(window.R3D){R3D.size();R3D.build(H,App.o3);}else{window.__pending3d=true;}}
function park3d(){const v=$("v3d"),h=$("v3dHold");if(v&&h&&v.parentNode!==h){h.appendChild(v);if(window.R3D)R3D.stop();}}
App.show3d=show3d;
render();
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const el=document.getElementById("v3d");const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdde4ec);const camera=new THREE.PerspectiveCamera(45,1,0.05,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a96a3,1.15));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(5,12,7);scene.add(dl);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.48;controls.minDistance=0.6;
let group=null,flows=[],running=false,last=0,fitKey="";const clock=new THREE.Clock();
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const Y_EPS=0.05,Y_PIPE=0.06,PR=0.011; /* 16 mm quvur, ko'rinishi uchun ozgina qalinlashtirilgan */
function tempColor(t,ts,tr){const k=Math.max(0,Math.min(1,(t-(tr-1))/(ts-(tr-1))));return new THREE.Color().setHSL((220-220*k)/360,0.8,0.48);}
function size(){const w=el.clientWidth,h=el.clientHeight;if(!w)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
function loop(t){if(!running)return;requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());controls.update();
  flows.forEach(f=>{f.u=(f.u+f.speed*dt)%1;for(let i=0;i<f.n;i++){const u=(f.u+i/f.n)%1;f.curve.getPointAt(u,f.tmp);f.dummy.position.copy(f.tmp);f.dummy.updateMatrix();f.mesh.setMatrixAt(i,f.dummy.matrix);}f.mesh.instanceMatrix.needsUpdate=true;});
  renderer.render(scene,camera);}
function start(){if(!running){running=true;clock.getDelta();requestAnimationFrame(loop);}}
function v3(p,y){return new THREE.Vector3(p[0],y,-p[1]);}
function build(H,o){if(group){scene.remove(group);group.traverse(m=>{if(m.geometry)m.geometry.dispose();});}group=new THREE.Group();flows=[];
  const st=H.P.set,ts=+st.tsF,tr=+st.trF;let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  H.ok.forEach(x=>{const A=x.P.map(p=>[p[0]+x.pos[0],p[1]+x.pos[1]]);A.forEach(p=>{mnx=Math.min(mnx,p[0]);mxx=Math.max(mxx,p[0]);mny=Math.min(mny,p[1]);mxy=Math.max(mxy,p[1]);});
    const shp=new THREE.Shape(A.map(p=>new THREE.Vector2(p[0],p[1])));
    const slab=(y0,y1,m)=>{const g=new THREE.ExtrudeGeometry(shp,{depth:y1-y0,bevelEnabled:false});g.rotateX(-Math.PI/2);g.translate(0,y0,0);const me=new THREE.Mesh(g,m);group.add(me);return me;};
    const pol=x.loops.length>0;
    if(o.layers&&pol){slab(-0.12,0,mat(0x9b9b96));slab(0,Y_EPS,mat(0xf1f4f8));}else{const c=o.heat&&pol?tempColor(x.tF,33,20):new THREE.Color(pol?0xd9d3c4:0xcfcfcf);slab(-0.02,Y_EPS,mat(c));}
    if(o.layers&&pol){const s=slab(Y_EPS,Y_EPS+0.045+PR*2,new THREE.MeshLambertMaterial({color:0xb8b2a6,transparent:true,opacity:0.32,depthWrite:false}));s.renderOrder=2;}
    for(let i=0;i<4;i++){const p=A[i],q=A[(i+1)%4],L=Math.hypot(q[0]-p[0],q[1]-p[1]),wh=1.0;const w=new THREE.Mesh(new THREE.BoxGeometry(L+0.12,wh,0.12),mat(x.r.ext[i]?0xc39a6b:0xf3f0ea));w.position.set((p[0]+q[0])/2,wh/2,-(p[1]+q[1])/2);w.rotation.y=Math.atan2(q[1]-p[1],q[0]-p[0]);group.add(w);}
    if(x.sec){let wi=x.r.ext.findIndex(e=>e);if(wi<0)wi=0;const p=A[wi],q=A[(wi+1)%4],dv=[q[0]-p[0],q[1]-p[1]],l=Math.hypot(...dv),n=[-dv[1]/l,dv[0]/l],per=Math.ceil(x.sec/x.rads);
      for(let k=0;k<x.rads;k++){const t=(k+1)/(x.rads+1),m=[p[0]+dv[0]*t+n[0]*0.12,p[1]+dv[1]*t+n[1]*0.12];const rg=new THREE.Group();
        for(let s=0;s<per;s++){const sc=new THREE.Mesh(new THREE.BoxGeometry(0.074,0.575,0.08),mat(0xffffff));sc.position.x=(s-(per-1)/2)*0.08;rg.add(sc);}
        rg.position.set(m[0],0.1+0.29,-m[1]);rg.rotation.y=Math.atan2(dv[1],dv[0]);group.add(rg);}}
    /* quvurlar: harorat bo'yicha rang */
    x.loops.forEach(z=>{const pts=z.full,C=H.coll;const P3=[];
      if(C){const top=v3(C.wallPt,0.78),wp=[C.wallPt[0]+C.n[0]*0.1-C.dir[0]*0.05,C.wallPt[1]+C.n[1]*0.1-C.dir[1]*0.05];P3.push(new THREE.Vector3(wp[0],0.78,-wp[1]));P3.push(new THREE.Vector3(wp[0],Y_PIPE+0.25,-wp[1]));}
      pts.forEach(p=>P3.push(v3(p,Y_PIPE)));
      if(C){const wp=[C.wallPt[0]+C.n[0]*0.1+C.dir[0]*0.05,C.wallPt[1]+C.n[1]*0.1+C.dir[1]*0.05];P3.push(new THREE.Vector3(wp[0],Y_PIPE+0.25,-wp[1]));P3.push(new THREE.Vector3(wp[0],0.58,-wp[1]));}
      const path=new THREE.CurvePath();for(let i=1;i<P3.length;i++){if(P3[i].distanceTo(P3[i-1])>1e-5)path.add(new THREE.LineCurve3(P3[i-1],P3[i]));}
      const Lt=path.getLength(),seg=Math.min(5000,Math.ceil(Lt/0.04)),rad=6,g=new THREE.TubeGeometry(path,seg,PR,rad,false);
      const ti=x.ti,lam=Lt/Math.log((ts-ti)/Math.max(0.5,tr-ti)),cols=new Float32Array((seg+1)*(rad+1)*3);
      for(let i=0;i<=seg;i++){const c=tempColor(ti+(ts-ti)*Math.exp(-(i/seg)*Lt/lam),ts,tr);for(let j=0;j<=rad;j++){const k=(i*(rad+1)+j)*3;cols[k]=c.r;cols[k+1]=c.g;cols[k+2]=c.b;}}
      g.setAttribute("color",new THREE.BufferAttribute(cols,3));group.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})));
      if(o.flow){const n=Math.max(4,Math.round(Lt/0.6)),mesh=new THREE.InstancedMesh(new THREE.SphereGeometry(PR*1.15,8,6),new THREE.MeshBasicMaterial({color:0xffffff}),n);group.add(mesh);
        flows.push({curve:path,mesh,n,u:0,speed:(z.v||0.15)*10/Lt,tmp:new THREE.Vector3(),dummy:new THREE.Object3D()});}});
  });
  /* kollektor */
  const C=H.coll;if(C&&H.loops.length){const n=H.loops.length,w=0.14+0.05*n,k=new THREE.Group();const cab=new THREE.Mesh(new THREE.BoxGeometry(w,0.6,0.09),mat(0xb7bec6));k.add(cab);
    [[0.22,0xd93636],[0.02,0x1f6fe0]].forEach(([y,c])=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,w-0.04,10),mat(c));b.rotation.z=Math.PI/2;b.position.set(0,y,0.07);k.add(b);});
    const p=C.wallPt;k.position.set(p[0]+C.n[0]*0.06,0.62,-(p[1]+C.n[1]*0.06));k.rotation.y=Math.atan2(C.dir[1],C.dir[0]);group.add(k);}
  scene.add(group);
  const key=H.ok.map(x=>x.r.id).join()+Math.round(mxx-mnx)+Math.round(mxy-mny);if(key!==fitKey){fitKey=key;const cx=(mnx+mxx)/2,cy=(mny+mxy)/2,sz=Math.max(mxx-mnx,mxy-mny,3);controls.target.set(cx,0,-cy);const dist=sz/(2*Math.tan(camera.fov*Math.PI/360))*Math.max(1.15,1.25/Math.max(camera.aspect,0.4));const dv=new THREE.Vector3(0.2,1.0,0.75).normalize().multiplyScalar(dist);camera.position.set(cx+dv.x,dv.y,-cy+dv.z);}
  start();}
window.R3D={build,size,stop(){running=false;}};
new ResizeObserver(size).observe(el);
if(window.__pending3d){window.__pending3d=false;window.App.show3d();}
</script>
